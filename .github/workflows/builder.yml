# Builds the double-click builder (HandkerchiefVitaBuilder) for Windows and Linux. It contains only this repository's
# code; it needs no game files and bundles no toolchain (the program downloads the pinned public tools when run).
# Runs on a tag push (v*) and attaches both files to the release; also runnable by hand (workflow_dispatch).
name: builder
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyinstaller capstone
      - run: python -c "import tkinter, hkbuild.gui"
      - run: python -m PyInstaller --noconfirm hkbuilder.spec
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/pkg | Out-Null
          Copy-Item dist/HandkerchiefVitaBuilder.exe dist/pkg/
          "1. Double-click HandkerchiefVitaBuilder.exe.`r`nIf Windows says 'protected your PC', click 'More info' then 'Run anyway' (the program is not code-signed).`r`n2. Follow the three steps in the window.`r`n`r`nPortugues: de dois cliques em HandkerchiefVitaBuilder.exe. Se o Windows avisar 'protegeu seu computador', clique em 'Mais informacoes' e 'Executar assim mesmo'. Siga os tres passos da janela." | Set-Content dist/pkg/READ-ME-FIRST.txt
          Compress-Archive -Path dist/pkg/* -DestinationPath HandkerchiefVitaBuilder-WINDOWS.zip
      - uses: actions/upload-artifact@v4
        with: {name: HandkerchiefVitaBuilder-WINDOWS, path: HandkerchiefVitaBuilder-WINDOWS.zip}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: HandkerchiefVitaBuilder-WINDOWS.zip, prerelease: false, make_latest: true}
  linux:
    runs-on: ubuntu-22.04   # old glibc so the binary runs on most distributions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y python3-tk tk
      - run: python -m pip install pyinstaller capstone
      - run: python -c "import tkinter, hkbuild.gui"
      - run: python -m PyInstaller --noconfirm hkbuilder.spec
      - name: Package
        run: |
          mkdir -p pkg && cp dist/HandkerchiefVitaBuilder pkg/ && chmod +x pkg/HandkerchiefVitaBuilder
          printf '1. Extract this archive.\n2. Double-click HandkerchiefVitaBuilder (or run ./HandkerchiefVitaBuilder in a terminal).\n   If the file manager asks, choose "Run". If nothing happens: chmod +x HandkerchiefVitaBuilder\n3. Follow the three steps in the window.\n\nPortugues: extraia o arquivo, de dois cliques em HandkerchiefVitaBuilder (ou rode ./HandkerchiefVitaBuilder no terminal) e siga os tres passos da janela.\n' > pkg/READ-ME-FIRST.txt
          tar -czf HandkerchiefVitaBuilder-LINUX.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with: {name: HandkerchiefVitaBuilder-LINUX, path: HandkerchiefVitaBuilder-LINUX.tar.gz}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: {files: HandkerchiefVitaBuilder-LINUX.tar.gz, prerelease: false, make_latest: true}
